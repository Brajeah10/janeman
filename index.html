<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Will You Be Mine? ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body {
      background: radial-gradient(circle at 30% 10%, #ffb6c1, #ff69b4, #d44a7a);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background 1s ease;
      padding: 20px;
    }

    /* floating background hearts */
    .bg-heart {
      position: fixed;
      color: rgba(255, 255, 255, 0.25);
      font-size: 2rem;
      animation: floatBg 8s infinite ease-in-out;
      pointer-events: none;
      z-index: 0;
      user-select: none;
    }

    @keyframes floatBg {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.2; }
      50% { transform: translateY(-30px) rotate(10deg); opacity: 0.5; }
      100% { transform: translateY(0) rotate(0deg); opacity: 0.2; }
    }

    /* main card */
    .card {
      background: rgba(255, 240, 245, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 60px 60px 40px 40px;
      padding: 2.5rem 2rem 3rem;
      box-shadow: 0 25px 40px rgba(180, 40, 80, 0.4), 0 0 0 2px #fff9fb inset, 0 0 30px #ffb6c1;
      max-width: 650px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 10;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    /* teddy + heart animation container */
    .teddy-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      animation: bounceTeddy 2s infinite ease-in-out;
    }

    .teddy {
      font-size: 3.8rem;
      filter: drop-shadow(0 8px 12px rgba(200, 50, 100, 0.4));
      animation: teddyWiggle 1.8s infinite alternate;
      display: inline-block;
    }

    .teddy-heart {
      font-size: 2.5rem;
      animation: heartBeat 1.2s infinite;
      filter: drop-shadow(0 0 12px #ff3b6f);
      display: inline-block;
    }

    @keyframes teddyWiggle {
      0% { transform: rotate(-5deg) scale(1); }
      100% { transform: rotate(5deg) scale(1.05); }
    }

    @keyframes heartBeat {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    @keyframes bounceTeddy {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      color: #b3003c;
      text-shadow: 3px 3px 0 #ffe4ec, 0 0 25px #ffb6c1;
      margin: 0.5rem 0 1.2rem;
      letter-spacing: 1px;
      word-break: break-word;
      transition: all 0.4s;
    }

    .message-box {
      min-height: 3.5rem;
      font-size: 1.35rem;
      font-weight: 500;
      color: #8b0033;
      background: #ffeef4;
      padding: 0.8rem 1.2rem;
      border-radius: 50px;
      margin: 1.2rem 0;
      box-shadow: 0 4px 12px rgba(255, 105, 180, 0.3);
      transition: all 0.3s;
      border: 1px dashed #ff8da1;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      margin: 2rem 0 1rem;
    }

    .btn {
      border: none;
      padding: 1rem 2.5rem;
      font-size: 1.8rem;
      font-weight: bold;
      border-radius: 60px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.1), 0 10px 20px rgba(200, 50, 100, 0.4);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 2px solid white;
      user-select: none;
    }

    .btn-yes {
      background: linear-gradient(145deg, #ff3b6f, #c9004a);
      color: white;
      text-shadow: 0 2px 4px #a10038;
    }

    .btn-yes:hover {
      transform: scale(1.05);
      background: linear-gradient(145deg, #ff5c8a, #d40052);
    }

    .btn-no {
      background: linear-gradient(145deg, #d9b0c5, #b37b9b);
      color: #4a1b2e;
      text-shadow: 0 1px 2px white;
      font-size: 1.8rem;
      padding: 1rem 2.2rem;
    }

    /* celebration overlay */
    .celebration-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }

    /* final story panel */
    .story-panel {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      animation: fadeInUp 1.2s forwards;
      width: 100%;
    }

    .story-panel.show {
      display: flex;
    }

    .story-text {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      padding: 1.8rem 1.5rem;
      border-radius: 50px;
      font-size: 1.25rem;
      line-height: 1.8;
      color: #5e0e30;
      font-weight: 500;
      border: 2px solid white;
      box-shadow: 0 0 30px #ffb6c1;
      max-width: 550px;
      margin: 0 auto;
    }

    .story-text p {
      margin: 0.6rem 0;
    }

    .forever {
      font-size: 2.2rem;
      font-weight: 800;
      color: #b3003c;
      text-shadow: 0 0 20px white, 0 0 30px #ff3b6f;
      margin-top: 1rem;
      animation: glowPulse 1.5s infinite alternate;
    }

    @keyframes glowPulse {
      from { text-shadow: 0 0 15px #fff, 0 0 25px #ff3b6f; }
      to { text-shadow: 0 0 25px #fff, 0 0 45px #ff0066; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .mini-teddy {
      font-size: 2.8rem;
      animation: teddyDance 1.4s infinite;
      display: inline-block;
    }

    @keyframes teddyDance {
      0% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-8px) rotate(5deg); }
      100% { transform: translateY(0) rotate(-5deg); }
    }

    .flex-center {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    /* mobile tweaks */
    @media (max-width: 550px) {
      h1 { font-size: 2rem; }
      .btn { font-size: 1.3rem; padding: 0.8rem 1.5rem; }
      .btn-no { font-size: 1.3rem; padding: 0.8rem 1.5rem; }
      .card { padding: 2rem 1.2rem; border-radius: 40px; }
      .teddy { font-size: 2.8rem; }
      .teddy-heart { font-size: 1.8rem; }
      .story-text { font-size: 1rem; padding: 1.2rem; }
      .forever { font-size: 1.6rem; }
      .message-box { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

  <!-- Background floating hearts -->
  <div id="bgHearts"></div>

  <!-- Main Card -->
  <div class="card" id="mainCard">
    <!-- Teddy & heart header -->
    <div class="teddy-container" id="teddyHeader">
      <span class="teddy">🧸</span>
      <span class="teddy-heart">❤️</span>
      <span class="teddy">🧸</span>
    </div>

    <h1 id="mainTitle">Will You Be Mine? ❤️</h1>

    <div class="message-box" id="messageBox">I've been waiting for you... 💕</div>

    <div class="btn-group" id="buttonGroup">
      <button class="btn btn-yes" id="yesBtn">YES ❤️</button>
      <button class="btn btn-no" id="noBtn">NO 💔</button>
    </div>

    <!-- Story panel (hidden initially) -->
    <div class="story-panel" id="storyPanel">
      <div class="flex-center">
        <span class="mini-teddy">🧸</span>
        <span class="mini-teddy">❤️</span>
        <span class="mini-teddy">🧸</span>
      </div>
      <div class="story-text">
        <p>❤️Thanku❤️you❤️Rasmalai😣</p>
        <!-- <p>Every smile, every conversation, and every little moment with you feels special.</p> -->
        <!-- <p>I don't need a perfect love story—<br>I just want our story to continue forever. ❤️</p> -->
        <!-- <p>I love you. Always and forever. 🧸💕</p> -->
      </div>
      <div class="forever">Forever Together ❤️✨</div>
      <div class="flex-center" style="gap:0.5rem; margin-top:0.5rem;">
        <span style="font-size:2.5rem;">🧸</span>
        <span style="font-size:2.5rem; animation:heartBeat 1s infinite;">❤️</span>
        <span style="font-size:2.5rem;">🧸</span>
      </div>
    </div>
  </div>

  <!-- overlay for dynamic effects -->
  <div class="celebration-overlay" id="celebrationOverlay"></div>

  <script>
    (function(){
      // ---------- DOM ELEMENTS ----------
      const bgHeartsContainer = document.getElementById('bgHearts');
      const mainCard = document.getElementById('mainCard');
      const mainTitle = document.getElementById('mainTitle');
      const messageBox = document.getElementById('messageBox');
      const yesBtn = document.getElementById('yesBtn');
      const noBtn = document.getElementById('noBtn');
      const buttonGroup = document.getElementById('buttonGroup');
      const storyPanel = document.getElementById('storyPanel');
      const celebrationOverlay = document.getElementById('celebrationOverlay');
      const teddyHeader = document.getElementById('teddyHeader');

      // No-button messages
      const noMessages = [
        "Are you sure? 🥺",
        "Please think again ❤️",
        "My heart will break 💔",
        "Don't do this to me 🥺",
        "I'll be sad forever 😢",
        "Pretty please? 🧸",
        "You're breaking my heart 💔",
        "Last chance! 🙏",
        "Think about the teddies 🧸🧸",
        "I'll cry... 😭"
      ];
      let messageIndex = 0;
      let noButtonMoved = false;

      // ---------- BACKGROUND FLOATING HEARTS ----------
      function createBgHearts() {
        const hearts = ['❤️', '💖', '💗', '💓', '🌸', '✨', '💕'];
        for (let i = 0; i < 18; i++) {
          const heart = document.createElement('div');
          heart.className = 'bg-heart';
          heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
          heart.style.left = Math.random() * 100 + '%';
          heart.style.top = Math.random() * 100 + '%';
          heart.style.fontSize = (1.8 + Math.random() * 2.5) + 'rem';
          heart.style.animationDelay = Math.random() * 8 + 's';
          heart.style.animationDuration = (5 + Math.random() * 8) + 's';
          bgHeartsContainer.appendChild(heart);
        }
      }
      createBgHearts();

      // ---------- NO BUTTON ESCAPE (FULL SCREEN) ----------
      function moveNoButton() {
        // Update message
        messageBox.textContent = noMessages[messageIndex % noMessages.length];
        messageIndex++;

        // Make button fixed position so it can go anywhere on screen
        if (!noButtonMoved) {
          // First time: detach from flow and set fixed position at its current location
          const rect = noBtn.getBoundingClientRect();
          noBtn.style.position = 'fixed';
          noBtn.style.left = rect.left + 'px';
          noBtn.style.top = rect.top + 'px';
          noBtn.style.width = rect.width + 'px';
          noBtn.style.zIndex = '9999';
          noBtn.style.margin = '0';
          noButtonMoved = true;
          
          // Force reflow
          void noBtn.offsetWidth;
        }

        // Get button dimensions
        const btnWidth = noBtn.offsetWidth;
        const btnHeight = noBtn.offsetHeight;
        
        // Calculate safe random position within viewport
        const padding = 10;
        const maxX = Math.max(padding, window.innerWidth - btnWidth - padding);
        const maxY = Math.max(padding, window.innerHeight - btnHeight - padding);
        
        // Random position
        const randomX = padding + Math.random() * (maxX - padding);
        const randomY = padding + Math.random() * (maxY - padding);

        // Apply smooth transition
        noBtn.style.transition = 'left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.2s';
        noBtn.style.left = randomX + 'px';
        noBtn.style.top = randomY + 'px';
        
        // Playful scale animation
        noBtn.style.transform = 'scale(0.95) rotate(' + (Math.random() * 20 - 10) + 'deg)';
        setTimeout(() => {
          noBtn.style.transform = 'scale(1) rotate(0deg)';
        }, 200);
      }

      // Desktop: move on hover
      noBtn.addEventListener('mouseenter', function(e) {
        if (!('ontouchstart' in window)) {
          moveNoButton();
        }
      });

      // Mobile: move on touchstart (before click)
      noBtn.addEventListener('touchstart', function(e) {
        e.preventDefault();
        moveNoButton();
      }, { passive: false });

      // Fallback: also move on click (in case touchstart didn't fire)
      noBtn.addEventListener('click', function(e) {
        e.preventDefault();
        if (!noButtonMoved || 'ontouchstart' in window) {
          moveNoButton();
        }
      });

      // Keep NO button within viewport on resize
      window.addEventListener('resize', function() {
        if (noButtonMoved && noBtn.style.position === 'fixed') {
          const rect = noBtn.getBoundingClientRect();
          const padding = 10;
          const maxX = window.innerWidth - rect.width - padding;
          const maxY = window.innerHeight - rect.height - padding;
          let newLeft = Math.min(Math.max(padding, rect.left), Math.max(padding, maxX));
          let newTop = Math.min(Math.max(padding, rect.top), Math.max(padding, maxY));
          noBtn.style.left = newLeft + 'px';
          noBtn.style.top = newTop + 'px';
        }
      });

      // ---------- YES CELEBRATION ----------
      let celebrationStarted = false;

      function startCelebration() {
        if (celebrationStarted) return;
        celebrationStarted = true;

        // Hide NO button completely
        noBtn.style.display = 'none';

        // Update card styling
        mainCard.style.background = 'rgba(255, 235, 245, 0.95)';
        mainCard.style.boxShadow = '0 0 50px #ff3b6f, 0 0 0 3px white inset';

        // Hide buttons, update message and title
        buttonGroup.style.display = 'none';
        messageBox.textContent = 'Yaaay! ❤️ You Said YES!';
        mainTitle.textContent = 'Yaaay! ❤️ You Said YES!';
        mainTitle.style.fontSize = '2.2rem';

        // Show story panel
        storyPanel.classList.add('show');

        // Change background
        document.body.style.background = 'radial-gradient(circle at 30% 10%, #ffb6c1, #ff69b4, #b3416b)';

        // Play soft romantic melody (Web Audio API - original composition)
        playSoftRomanticMelody();

        // Start all visual effects
        startVisualEffects();
      }

      // ---------- WEB AUDIO ROMANTIC MELODY (Original, non-copyrighted) ----------
      function playSoftRomanticMelody() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          
          // Resume context if suspended (autoplay policy)
          if (ctx.state === 'suspended') {
            ctx.resume();
          }

          const now = ctx.currentTime;
          const masterGain = ctx.createGain();
          masterGain.gain.setValueAtTime(0.0001, now);
          masterGain.gain.exponentialRampToValueAtTime(0.15, now + 2);
          masterGain.connect(ctx.destination);

          // Soft romantic melody in C major / A minor feel
          const melody = [
            { note: 'E4', dur: 0.8, time: 0 },
            { note: 'G4', dur: 0.8, time: 0.8 },
            { note: 'A4', dur: 0.8, time: 1.6 },
            { note: 'B4', dur: 0.8, time: 2.4 },
            { note: 'A4', dur: 0.8, time: 3.2 },
            { note: 'G4', dur: 0.8, time: 4.0 },
            { note: 'E4', dur: 0.8, time: 4.8 },
            { note: 'D4', dur: 0.8, time: 5.6 },
            { note: 'E4', dur: 0.8, time: 6.4 },
            { note: 'G4', dur: 0.8, time: 7.2 },
            { note: 'A4', dur: 1.2, time: 8.0 },
            { note: 'G4', dur: 1.2, time: 9.2 },
            { note: 'E4', dur: 1.6, time: 10.4 },
            { note: 'D4', dur: 0.8, time: 12.0 },
            { note: 'E4', dur: 0.8, time: 12.8 },
            { note: 'G4', dur: 0.8, time: 13.6 },
            { note: 'A4', dur: 1.6, time: 14.4 },
            { note: 'G4', dur: 1.6, time: 16.0 },
            { note: 'E4', dur: 2.0, time: 17.6 },
          ];

          const noteFreq = {
            'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23,
            'G4': 392.00, 'A4': 440.00, 'B4': 493.88, 'C5': 523.25,
          };

          // Schedule melody notes
          melody.forEach((item) => {
            const osc = ctx.createOscillator();
            const gainNode = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = noteFreq[item.note] || 440;

            const startTime = now + item.time;
            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(0.25, startTime + 0.1);
            gainNode.gain.linearRampToValueAtTime(0.08, startTime + item.dur * 0.7);
            gainNode.gain.linearRampToValueAtTime(0, startTime + item.dur);

            osc.connect(gainNode);
            gainNode.connect(masterGain);
            osc.start(startTime);
            osc.stop(startTime + item.dur + 0.1);
          });

          // Add gentle pad chord
          const chordNotes = [329.63, 392.00, 493.88]; // E4, G4, B4
          chordNotes.forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gainNode = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.04, now + 2);
            gainNode.gain.linearRampToValueAtTime(0.04, now + 15);
            gainNode.gain.linearRampToValueAtTime(0, now + 20);
            osc.connect(gainNode);
            gainNode.connect(masterGain);
            osc.start(now);
            osc.stop(now + 20);
          });

        } catch (e) {
          console.warn('Audio context not available', e);
        }
      }

      // ---------- VISUAL EFFECTS ----------
      function startVisualEffects() {
        // Initial burst
        spawnHearts(25);
        for (let i = 0; i < 6; i++) {
          setTimeout(() => spawnFirework(), i * 200);
        }

        // Continuous effects
        const interval = setInterval(() => {
          if (!celebrationStarted) {
            clearInterval(interval);
            return;
          }
          if (Math.random() < 0.5) spawnFirework();
          if (Math.random() < 0.6) spawnConfetti();
          if (Math.random() < 0.7) spawnPetal();
          if (Math.random() < 0.4) spawnHeartPop();
        }, 350);
      }

      function spawnHearts(count) {
        for (let i = 0; i < count; i++) {
          const heart = document.createElement('div');
          heart.textContent = ['❤️', '💖', '💗', '💓', '💕', '🌸'][Math.floor(Math.random() * 6)];
          heart.style.cssText = `
            position: fixed;
            left: ${Math.random() * 100}%;
            top: ${Math.random() * 100}%;
            font-size: ${1.5 + Math.random() * 3}rem;
            opacity: 1;
            pointer-events: none;
            z-index: 1200;
            transition: transform 1.8s ease-out, opacity 1.8s;
            transform: scale(0.5);
          `;
          celebrationOverlay.appendChild(heart);

          requestAnimationFrame(() => {
            heart.style.transform = `translate(${(Math.random() - 0.5) * 500}px, ${(Math.random() - 0.5) * 500}px) scale(1.5) rotate(${Math.random() * 360}deg)`;
            heart.style.opacity = '0';
          });

          setTimeout(() => heart.remove(), 1800);
        }
      }

      function spawnFirework() {
        const x = Math.random() * window.innerWidth;
        const y = Math.random() * window.innerHeight * 0.7;
        const colors = ['#ff3b6f', '#ffb6c1', '#d44a7a', '#ff69b4', '#ffffff', '#ffcc00', '#ff0066'];
        const icons = ['✨', '💥', '🎆', '🎇', '⭐'];

        for (let i = 0; i < 10; i++) {
          const particle = document.createElement('div');
          particle.textContent = icons[Math.floor(Math.random() * icons.length)];
          particle.style.cssText = `
            position: fixed;
            left: ${x}px;
            top: ${y}px;
            font-size: ${0.8 + Math.random() * 1.5}rem;
            color: ${colors[Math.floor(Math.random() * colors.length)]};
            opacity: 1;
            pointer-events: none;
            z-index: 1300;
            transition: transform 1.2s ease-out, opacity 1.2s;
          `;
          celebrationOverlay.appendChild(particle);

          const angle = Math.random() * Math.PI * 2;
          const dist = 80 + Math.random() * 180;

          requestAnimationFrame(() => {
            particle.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px) scale(0.3)`;
            particle.style.opacity = '0';
          });

          setTimeout(() => particle.remove(), 1300);
        }
      }

      function spawnConfetti() {
        const confetti = document.createElement('div');
        confetti.textContent = ['🎉', '🎊', '✨', '💖', '🌸', '💕', '🌟'][Math.floor(Math.random() * 7)];
        confetti.style.cssText = `
          position: fixed;
          left: ${Math.random() * 100}%;
          top: -5%;
          font-size: ${1 + Math.random() * 2}rem;
          opacity: 1;
          pointer-events: none;
          z-index: 1100;
          transition: transform 3.5s linear, opacity 3.5s;
        `;
        celebrationOverlay.appendChild(confetti);

        requestAnimationFrame(() => {
          confetti.style.transform = `translateY(${window.innerHeight + 100}px) rotate(${Math.random() * 720}deg)`;
          confetti.style.opacity = '0.8';
        });

        setTimeout(() => confetti.remove(), 3600);
      }

      function spawnPetal() {
        const petal = document.createElement('div');
        petal.textContent = ['🌹', '🌸', '🌺', '🌷', '💮'][Math.floor(Math.random() * 5)];
        petal.style.cssText = `
          position: fixed;
          left: ${Math.random() * 100}%;
          top: -5%;
          font-size: ${1.2 + Math.random() * 1.8}rem;
          opacity: 1;
          pointer-events: none;
          z-index: 1100;
          transition: transform 4.5s linear, opacity 4.5s;
        `;
        celebrationOverlay.appendChild(petal);

        requestAnimationFrame(() => {
          petal.style.transform = `translateY(${window.innerHeight + 100}px) rotate(${Math.random() * 360}deg)`;
          petal.style.opacity = '0.6';
        });

        setTimeout(() => petal.remove(), 4600);
      }

      function spawnHeartPop() {
        const heart = document.createElement('div');
        heart.textContent = ['❤️', '💖', '💕', '💗'][Math.floor(Math.random() * 4)];
        heart.style.cssText = `
          position: fixed;
          left: ${Math.random() * 100}%;
          top: ${Math.random() * 100}%;
          font-size: ${1.5 + Math.random() * 2}rem;
          opacity: 0.9;
          pointer-events: none;
          z-index: 1200;
          transition: transform 1.5s ease-out, opacity 1.5s;
        `;
        celebrationOverlay.appendChild(heart);

        requestAnimationFrame(() => {
          heart.style.transform = `scale(2.5) translateY(-120px)`;
          heart.style.opacity = '0';
        });

        setTimeout(() => heart.remove(), 1600);
      }

      // YES button event
      yesBtn.addEventListener('click', startCelebration);

      // Trigger resize to check NO button position
      window.dispatchEvent(new Event('resize'));
    })();
  </script>
</body>
</html>
